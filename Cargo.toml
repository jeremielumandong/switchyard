[workspace]
resolver = "3"
# Vendored dependencies are patched in below, not workspace members.
exclude = [
    "vendor/tiberius",
    "vendor/ssh-key",
    "vendor/ironrdp-connector",
    "vendor/gpui-base",
    "vendor/gpui-fast",
]
members = [
    "crates/app",
    "crates/core",
    "crates/store",
    "crates/db",
    "crates/remote",
    "crates/term",
    "crates/drivers",
    "crates/plan",
    "crates/cli",
    "crates/agents",
    "crates/api",
    "crates/cloud",
    "crates/containers",
]
default-members = [
    "crates/core",
    "crates/store",
    "crates/db",
    "crates/remote",
    "crates/term",
    "crates/drivers",
    "crates/plan",
    "crates/cli",
    "crates/agents",
    "crates/api",
    "crates/cloud",
    "crates/containers",
    "crates/app",
]

[workspace.package]
version = "0.1.17"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jeremielumandong/switchyard"
rust-version = "1.98"

[workspace.dependencies]
# Local time (welcome greeting); already in the tree through other crates.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# internal
switchyard-core = { path = "crates/core" }
switchyard-store = { path = "crates/store" }
switchyard-db = { path = "crates/db" }
switchyard-remote = { path = "crates/remote" }
switchyard-term = { path = "crates/term" }
switchyard-drivers = { path = "crates/drivers" }
switchyard-plan = { path = "crates/plan" }
switchyard-agents = { path = "crates/agents" }
switchyard-api = { path = "crates/api" }
switchyard-cloud = { path = "crates/cloud" }
switchyard-containers = { path = "crates/containers" }

# UI: gpui-kit is the facade over gpui (gpui-pre =0.3.9) + gpui-component 0.7.3, kept in lockstep.
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-sql"] }

# async
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# PostgreSQL
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
postgres-types = "0.2"

# SQL tooling
sqlparser = "0.63"

# storage and secrets
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
secrecy = { version = "0.10", features = ["serde"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"

# TLS / net
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# Async TLS for the Redis client; already in the tree through tokio-postgres-rustls.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# platform
directories = "6"
libloading = "0.9"
minisign-verify = "0.2"
# gzip for Driver Manager archives; already in the tree through russh (needs approval).
flate2 = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / logs
thiserror = "2"
anyhow = "1"
tracing = "0.1"
alacritty_terminal = "=0.26.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
portable-pty = "=0.9.0"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "=3.0.1"
# FTP / FTPS (MIT OR Apache-2.0). `deprecated` gates implicit TLS (`connect_secure_implicit`).
suppaftp = { version = "=12.1.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
# `winauth`: Windows integrated auth (SSPI). `sspi-rs`: NTLM on Linux/macOS (pure Rust).
# Kerberos on Linux/macOS goes through the vendored copy's external-auth hook with a
# runtime-loaded GSSAPI (see vendor/tiberius/VENDORED.md).
tiberius = { version = "=0.13.0", default-features = false, features = ["tds80", "rustls", "winauth", "sspi-rs"] }
hmac = "=0.13.0"
sha1 = "=0.11.0"
data-encoding = "2"
# SHA-256 and CSPRNG for the Entra PKCE flow; already in the tree as rustls' provider.
ring = "0.17"
# API workspace (switchyard-api, ported from AgentOps; approved by the user with the
# workbench port, see DECISIONS 2026-10-07). Most were already in the graph.
aho-corasick = "1"
base64 = "0.23"
boa_engine = { version = "0.21", default-features = false, features = ["annex-b"] }
hex = "0.4"
httpdate = "1"
psl = "2.1"
regex = "1"
serde_yaml = "0.9"
sha2 = "0.10"
# DBeaver credentials-config.json (AES-128-CBC); the versions keyring/ssh-key already use.
aes = "0.8"
cbc = "0.1"
# Oracle: ODPI-C built from source; it loads Instant Client at runtime (no build-time link).
oracle = "0.6"
# MySQL / MariaDB: pure-Rust wire protocol on tokio + rustls (MIT OR Apache-2.0); no
# native library. `ring` matches the rest of the tree; roots come from the OS store.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# MongoDB: the official driver (Apache-2.0), rustls with ring like the rest of the tree;
# `dns-resolver` resolves mongodb+srv:// seed lists. See DECISIONS 2026-10-08.
mongodb = "3.9"
# Snowflake key-pair auth: parse PKCS#1 / (encrypted) PKCS#8 keys; ring signs.
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "pkcs5", "u64_digit"] }
sxd-document = "0.3"
sxd-xpath = "0.4"
serde_json_path = "0.7"
# Same versions gpui-kit already builds (HTML / Markdown response previews).
html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"
markdown = "=1.0.0"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# API workbench protocols (WebSocket, gRPC), behind switchyard-api's `websocket` and
# `grpc` features (on by default). Approved by Jeremie on 2026-10-12, see DECISIONS.
# WebSocket (MIT): handshake only; TLS is our tokio-rustls config.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# gRPC (tonic MIT, prost Apache-2.0, prost-reflect / protox MIT OR Apache-2.0): a client
# channel with rustls (ring) and the OS roots; dynamic messages; `.proto` files compiled in
# process (no protoc). Tests add tonic's server and tonic-reflection's server.
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
tonic-reflection = { version = "=0.14.6", default-features = false }
prost = "=0.14.4"
prost-types = "=0.14.4"
prost-reflect = { version = "=0.16.5", features = ["serde"] }
protox = { version = "=0.10.0", default-features = false }

# In-app RDP (`rdp-embedded` feature; MIT OR Apache-2.0, approved by the user on
# 2026-10-12). ironrdp-connector is vendored for sspi 0.23 / picky rc.26, see
# vendor/ironrdp-connector/VENDORED.md. No TLS or HTTP features: Switchyard does TLS itself.
ironrdp-connector = "=0.10.0"
ironrdp-session = "=0.11.0"
ironrdp-pdu = "=0.9.0"
ironrdp-graphics = "=0.9.0"
ironrdp-input = "=0.7.0"
ironrdp-core = "0.2"
ironrdp-tokio = { version = "=0.10.0", default-features = false }

# The in-app RDP tab hands GPUI its desktop image as an `image::Frame` (GPUI's
# `RenderImage` API): the version GPUI already builds, no default features.
image = { version = "0.25", default-features = false }

# editor completion items (must match gpui-component)
lsp-types = "0.97"

# ER diagram layout (DBX-5d): dagre port, Apache-2.0; its default `json` feature is
# required (the crate does not build without it) and only pulls serde / serde_json.
dagre = "=0.1.1"

# plans / cli
quick-xml = "0.42"
clap = { version = "4.6", features = ["derive"] }

# testing
insta = { version = "1.49", features = ["yaml"] }
criterion = "0.8"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
# Keep debug builds snappy for the UI: optimize dependencies, not our crates.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# GPUI Kit 0.7.3 on the application-patched GPUI Fast stack (shared with AgentOpsChat).
# Local snapshot facades keep Kit, Component and Base on the same native core; see
# vendor/gpui-fast/compat/README.md and docs/DECISIONS.md.
[patch.crates-io]
tiberius = { path = "vendor/tiberius" }
ssh-key = { path = "vendor/ssh-key" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
gpui-base = { path = "vendor/gpui-base" }
gpui-pre = { path = "vendor/gpui-fast/compat/gpui-pre" }
gpui-pre-platform = { path = "vendor/gpui-fast/compat/gpui-pre-platform" }
gpui-pre-macros = { path = "vendor/gpui-fast/compat/gpui-pre-macros" }
gpui-pre-sum-tree = { path = "vendor/gpui-fast/compat/gpui-pre-sum-tree" }
gpui-pre-web = { path = "vendor/gpui-fast/compat/gpui-pre-web" }

[patch."https://github.com/longbridge/gpui-fast"]
gpui = { path = "vendor/gpui-fast/crates/gpui" }
gpui_linux = { path = "vendor/gpui-fast/crates/gpui_linux" }
gpui_windows = { path = "vendor/gpui-fast/crates/gpui_windows" }
