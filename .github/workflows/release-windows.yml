name: Windows signed release package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with Linux: serialize draft creation and asset uploads.
  group: shared-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 120
    environment: windows-release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      AZURE_CODESIGNING_ENDPOINT: ${{ vars.AZURE_CODESIGNING_ENDPOINT }}
      AZURE_CODESIGNING_ACCOUNT: ${{ vars.AZURE_CODESIGNING_ACCOUNT }}
      AZURE_CODESIGNING_PROFILE: ${{ vars.AZURE_CODESIGNING_PROFILE }}
      # Either name works, so an environment set up for Emulsion can be reused as is.
      SWITCHYARD_SIGN_EXPECTED_SUBJECT: ${{ vars.SWITCHYARD_SIGN_EXPECTED_SUBJECT || vars.EMULSION_SIGN_EXPECTED_SUBJECT }}
      SWITCHYARD_SIGN_AZURE_CLI_ONLY: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require passing CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $response = gh api "repos/$env:REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&branch=main&event=push&per_page=1"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read CI status.' }
          $runs = ($response | ConvertFrom-Json).workflow_runs
          if ($runs.Count -eq 0 -or $runs[0].conclusion -ne 'success') {
            throw 'Release blocked: the latest main-branch CI run for this commit must pass first.'
          }
      - name: Check shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/upload-release-assets.py windows --check
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight failed.' }
      - name: Check signing configuration and prerequisites
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'AZURE_CODESIGNING_ENDPOINT', 'AZURE_CODESIGNING_ACCOUNT',
            'AZURE_CODESIGNING_PROFILE', 'SWITCHYARD_SIGN_EXPECTED_SUBJECT')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing windows-release environment variable: $name"
            }
          }
          if ($env:SWITCHYARD_SIGN_EXPECTED_SUBJECT.StartsWith("'") -or $env:SWITCHYARD_SIGN_EXPECTED_SUBJECT.StartsWith('"')) {
            throw 'Enter the expected subject without surrounding quotes in GitHub.'
          }
          $runtimes = dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($runtimes -match '^Microsoft.NETCore.App 8\.')) {
            throw 'The signing client requires the x64 .NET 8 runtime.'
          }
          . ./packaging/windows/trusted-signing.ps1
          $context = New-TrustedSigningContext
          "SWITCHYARD_SIGN_DLIB=$($context.Dlib)" >> $env:GITHUB_ENV
          "SWITCHYARD_SIGN_SIGNTOOL=$($context.SignTool)" >> $env:GITHUB_ENV
      # Chocolatey can exit 0 having installed nothing (a 504 from its feed: "installed 0/0
      # packages"), so check for makensis after each attempt, retry, fall back to winget,
      # and fail here rather than after the 30-minute build.
      - name: NSIS
        run: |
          function Find-Makensis {
            @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $makensis = Find-Makensis
          for ($attempt = 1; -not $makensis -and $attempt -le 3; $attempt++) {
            Write-Host "Installing NSIS with Chocolatey (attempt $attempt of 3)"
            choco install nsis -y --no-progress
            $makensis = Find-Makensis
            if (-not $makensis -and $attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not $makensis) {
            Write-Host 'Chocolatey did not install NSIS; trying winget'
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            $makensis = Find-Makensis
          }
          if (-not $makensis) { throw 'NSIS installation failed: makensis.exe not found.' }
          Write-Host "makensis: $makensis"
          & $makensis /VERSION
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-windows-release
          cache-on-failure: true
      - name: Compile release executables
        env:
          # Baked into the build (empty when the repository variable is unset).
          SWITCHYARD_ENTRA_CLIENT_ID: ${{ vars.SWITCHYARD_ENTRA_CLIENT_ID }}
        run: ./packaging/windows/build-windows.ps1
      # Sign in after compiling and don't rebuild afterwards: the GitHub OIDC assertion can
      # expire before SignTool exchanges it for a signing token.
      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package, sign, and verify the Windows installer
        run: ./packaging/windows/build-windows.ps1 -Sign -SkipBuild
      - name: Write installer checksum
        run: |
          $installers = @(Get-ChildItem dist/Switchyard-*-windows-x64-setup.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one verified installer.' }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          }
      - name: Keep the verified installer as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Switchyard-windows-x64-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/Switchyard-*-windows-x64-setup.exe
            dist/Switchyard-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload signed Windows assets to shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/upload-release-assets.py windows
          if ($LASTEXITCODE -ne 0) { throw 'Uploading Windows release assets failed.' }
