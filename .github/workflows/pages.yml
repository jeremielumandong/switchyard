name: Website

# Publishes site/ to GitHub Pages. The screenshots and icon are copied in from
# docs/screenshots and packaging/icons, so the README and the site share one copy.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - packaging/icons/switchyard.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/screenshots _site/screenshots
          cp packaging/icons/switchyard.svg _site/icon.svg
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
