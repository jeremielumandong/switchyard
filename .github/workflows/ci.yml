name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    name: integration (PostgreSQL, SSH, tunnels)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchyard
          POSTGRES_PASSWORD: switchyard
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchyard -d shop"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Seed sample schema
        env:
          PGPASSWORD: switchyard
        run: |
          for f in docker/postgres/*.sql; do
            psql -h localhost -U switchyard -d shop -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Start SSH test servers
        run: sudo DIR=/tmp/switchyard-ssh scripts/ssh-test-servers.sh
      - run: cargo test -p switchyard-db --lib --test pg --test d1 -- --ignored --test-threads 1
      - run: cargo test -p switchyard-core -p switchyard-remote -- --ignored --test-threads 1
        env:
          SWITCHYARD_SSH_KEYS: /tmp/switchyard-ssh

  integration-mssql:
    name: integration (SQL Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Start SQL Server
        run: DIR=/tmp/switchyard-mssql scripts/mssql-test-server.sh
      - run: cargo test -p switchyard-db --test mssql -- --ignored --test-threads 1
        env:
          SWITCHYARD_MSSQL_CA: /tmp/switchyard-mssql/ca.pem
      - name: Kerberos test realm
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends krb5-kdc krb5-user
          echo "127.0.0.1 db.switchyard.test" | sudo tee -a /etc/hosts
          scripts/kerberos-test-kdc.sh start | sed 's/^export //; s/"//g' >> "$GITHUB_ENV"
      - name: GSSAPI (runtime-loaded) against the test KDC
        run: cargo test -p switchyard-drivers --test gssapi -- --ignored --test-threads 1
      - name: Integrated auth through core to SQL Server
        run: cargo test -p switchyard-core --test integrated -- --ignored --test-threads 1
        env:
          SSL_CERT_FILE: /tmp/switchyard-mssql/ca.pem
          SSL_CERT_DIR: /nonexistent
