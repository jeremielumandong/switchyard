name: Bump version

# Bumps the workspace version on a new branch and opens a pull request. Merging it is an
# ordinary push to main, which runs CI; the release workflows require that run to pass.
# (A commit pushed here with GITHUB_TOKEN would not trigger CI, so this never pushes to main.)
# Opening the PR needs "Allow GitHub Actions to create and approve pull requests" (Settings >
# Actions > General); without it the run pushes the branch and links to open the PR by hand.
# Re-running for the same version reuses that branch.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version (MAJOR.MINOR.PATCH); overrides the choice above
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Bump
        id: bump
        env:
          BUMP: ${{ inputs.version != '' && inputs.version || inputs.bump }}
        run: |
          old=$(python3 scripts/bump-version.py --current)
          new=$(python3 scripts/bump-version.py "$BUMP" | tail -n1)
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          branch="bump/v$NEW"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/new/$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json url --jq '.[].url')" ]; then
            echo "::error::A pull request for $branch is already open."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            # Left by an earlier run whose pull request could not be opened: reuse it if it
            # holds this version.
            git fetch --depth 1 origin "$branch"
            if [ "$(git show FETCH_HEAD:Cargo.toml | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')" != "$NEW" ]; then
              echo "::error::Branch $branch exists with another version; delete it first."
              exit 1
            fi
            echo "Reusing the existing $branch."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$branch"
            git add Cargo.toml Cargo.lock
            git commit -m "Bump version to $NEW"
            git push origin "$branch"
          fi
          if ! gh pr create --base main --head "$branch" --title "Bump version to $NEW" \
            --body "Bumps the workspace version from $OLD to $NEW (\`scripts/bump-version.py\`). Merge, wait for CI on main, then run the release workflows."; then
            # Usually "GitHub Actions is not permitted to create or approve pull requests".
            echo "::warning::Could not open the pull request. Open it here: $compare (or allow Actions to create pull requests in Settings > Actions > General and re-run)."
            echo "Open the pull request: $compare" >> "$GITHUB_STEP_SUMMARY"
          fi
