[package]
name = "switchyard-core"
description = "Hosts, connections, sessions, environment rules, tokio runtime and event bus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
switchyard-store.workspace = true
switchyard-db.workspace = true
reqwest.workspace = true
switchyard-remote.workspace = true
switchyard-term.workspace = true
switchyard-drivers.workspace = true
switchyard-plan.workspace = true
switchyard-api.workspace = true
switchyard-agents.workspace = true
switchyard-cloud.workspace = true
switchyard-containers.workspace = true
url.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["process"] }
futures.workspace = true
secrecy.workspace = true
sha2.workspace = true
aes.workspace = true
cbc.workspace = true
serde.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = ["rdp-embedded"]
# The in-app RDP tab's session (IronRDP, through switchyard-remote). Off: RDP opens with
# the system client only, and the tab reports that the build has no in-app client.
rdp-embedded = ["switchyard-remote/rdp-embedded"]

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
