[package]
name = "switchyard-remote"
description = "SSH sessions, tunnels, SFTP, FTP/FTPS and the RemoteFs trait"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
russh.workspace = true
russh-sftp.workspace = true
suppaftp.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tokio-rustls.workspace = true
secrecy.workspace = true
hmac.workspace = true
ring.workspace = true
sha1.workspace = true
data-encoding.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["fs", "net", "sync", "time", "macros", "io-util", "rt"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# In-app RDP client (IronRDP), see `rdp`.
ironrdp-connector = { workspace = true, optional = true }
ironrdp-session = { workspace = true, optional = true }
ironrdp-pdu = { workspace = true, optional = true }
ironrdp-graphics = { workspace = true, optional = true }
ironrdp-input = { workspace = true, optional = true }
ironrdp-core = { workspace = true, optional = true }
ironrdp-tokio = { workspace = true, optional = true }

[features]
default = []
# The in-app RDP client (`rdp` module). Off: only external RDP clients.
rdp-embedded = [
    "dep:ironrdp-connector",
    "dep:ironrdp-session",
    "dep:ironrdp-pdu",
    "dep:ironrdp-graphics",
    "dep:ironrdp-input",
    "dep:ironrdp-core",
    "dep:ironrdp-tokio",
]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }
insta.workspace = true

[lints]
workspace = true
